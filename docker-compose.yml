services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: piedrazul
    ports:
      - "5432:5432"
    volumes:
      - piedrazul_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d piedrazul"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Proveedor de identidad. Importa el realm "piedrazul" (roles, cliente del backend y
  # usuarios de prueba) desde keycloak/realm-piedrazul.json la primera vez que arranca.
  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/realm-piedrazul.json:/opt/keycloak/data/import/realm-piedrazul.json:ro

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:postgres@db:5432/piedrazul
      CORS_ORIGINS: '["http://localhost:4200"]'
      KEYCLOAK_URL: http://keycloak:8080
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  piedrazul_db:
