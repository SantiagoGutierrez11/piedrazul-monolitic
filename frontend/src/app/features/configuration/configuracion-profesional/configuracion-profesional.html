<div class="configuracion-profesional">
  <p class="breadcrumb">Administración / Configuración / Profesional</p>
  <h1>Configuración de Disponibilidad del Profesional</h1>
  <p class="subtitle">Defina los días, horarios y duración de las citas para cada profesional.</p>

  <div class="card">
    <div class="field">
      <label for="doctorId">
        Profesional (ID)
        <span class="required">*</span>
      </label>
      <div class="selector">
        <input
          id="doctorId"
          type="number"
          min="1"
          placeholder="Ej. 1"
          [ngModel]="selectedDoctorId()"
          (ngModelChange)="selectedDoctorId.set($event)"
          name="doctorId"
        />
        <button type="button" class="secondary" (click)="cargar()" [disabled]="loading()">
          {{ loading() ? 'Cargando...' : 'Cargar disponibilidad' }}
        </button>
      </div>
    </div>

    <div class="field">
      <label>Días de atención</label>
      <div class="dias">
        @for (day of days(); track day.dayOfWeek) {
          <label class="dia">
            <input
              type="checkbox"
              [ngModel]="day.selected"
              (ngModelChange)="alternarDia(day.dayOfWeek, $event)"
              [name]="'dia-' + day.dayOfWeek"
            />
            {{ day.label }}
          </label>
        }
      </div>
    </div>

    <div class="field">
      <label>Franja horaria de atención</label>
      <div class="franja">
        <div>
          <label for="startTime">Hora de inicio <span class="required">*</span></label>
          <input
            id="startTime"
            type="time"
            [ngModel]="startTime()"
            (ngModelChange)="startTime.set($event)"
            name="startTime"
          />
        </div>
        <div>
          <label for="endTime">Hora de fin <span class="required">*</span></label>
          <input
            id="endTime"
            type="time"
            [ngModel]="endTime()"
            (ngModelChange)="endTime.set($event)"
            name="endTime"
          />
        </div>
      </div>
    </div>

    <div class="field intervalo">
      <label for="interval">
        Intervalo entre citas (minutos)
        <span class="required">*</span>
      </label>
      <input
        id="interval"
        type="number"
        min="5"
        step="5"
        [ngModel]="intervalMinutes()"
        (ngModelChange)="intervalMinutes.set($event)"
        name="interval"
      />
    </div>

    <div class="acciones">
      <button type="button" class="secondary" (click)="cancelar()">Cancelar</button>
      <button type="button" (click)="guardar()" [disabled]="saving()">
        {{ saving() ? 'Guardando...' : 'Guardar disponibilidad' }}
      </button>
    </div>

    @if (message()) {
      <p class="alert ok">{{ message() }}</p>
    }
    @if (error()) {
      <p class="alert error">{{ error() }}</p>
    }
  </div>
</div>
