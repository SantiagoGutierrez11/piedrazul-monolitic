<div class="configuracion-global">
  <app-page-header
    ruta="Administración / Configuración / Global"
    titulo="Configuración Global del Sistema"
    subtitulo="Defina la ventana de tiempo en semanas en la que los pacientes pueden agendar citas."
  />

  <div class="card">
    <div class="field">
      <label for="weeks">
        Ventana de tiempo para agendar citas (semanas)
        <span class="required">*</span>
      </label>
      <input
        id="weeks"
        type="number"
        min="1"
        max="52"
        [ngModel]="weeks()"
        (ngModelChange)="weeks.set($event)"
        name="weeks"
      />
      <small class="hint">Define cuántas semanas hacia adelante se pueden reservar citas.</small>
    </div>

    <div class="acciones">
      <button type="button" class="secondary" (click)="cancelar()">Cancelar</button>
      <button type="button" (click)="guardar()" [disabled]="saving()">
        {{ saving() ? 'Guardando...' : 'Guardar configuración' }}
      </button>
    </div>

    @if (message()) {
      <app-alert tono="ok">{{ message() }}</app-alert>
    }
    @if (error()) {
      <app-alert tono="error">{{ error() }}</app-alert>
    }
  </div>
</div>
