<div class="cita">
  <span class="cita__icono" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <rect x="3" y="5" width="18" height="16" rx="2" />
      <path d="M3 10h18M8 3v4M16 3v4" stroke-linecap="round" />
    </svg>
  </span>

  <span class="cita__datos">
    <strong>{{ fechaLarga(cita().date) }}</strong>
    <span>
      {{ horaAmPm(cita().startTime) }} · {{ cita().doctorName }}, {{ servicios[cita().serviceType] }}
    </span>
  </span>

  <span class="badge" [class]="'badge--' + cita().status.toLowerCase()">
    @switch (cita().status) {
      @case ('CANCELADA') {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M9 9l6 6M15 9l-6 6" stroke-linecap="round" />
        </svg>
      }
      @default {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <circle cx="12" cy="12" r="9" />
          <path d="M8.5 12.5l2.5 2.5 4.5-5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      }
    }
    {{ estados[cita().status] }}
  </span>

  @if (cancelable()) {
    <button type="button" class="cancelar" (click)="cancelar.emit(cita())">Cancelar</button>
  }
</div>
