<app-auth-layout subtitulo="Citas Médicas">
  <section class="auth-card login-card">
    <h1 class="titulo">Iniciar sesión</h1>

    <form [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
      <app-form-field
        etiqueta="Correo electrónico"
        idControl="email"
        obligatorio
        [error]="
          mostrarError('email')
            ? form.controls.email.hasError('required')
              ? 'El correo electrónico es obligatorio'
              : 'Ingresa un correo válido, por ejemplo nombre@correo.com'
            : ''
        "
      >
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="correo@ejemplo.com"
          autocomplete="username"
          [class.invalid]="mostrarError('email')"
        />
      </app-form-field>

      <app-form-field
        etiqueta="Contraseña"
        idControl="password"
        obligatorio
        [error]="mostrarError('password') ? 'La contraseña es obligatoria' : ''"
      >
        <div class="password-input">
          <input
            id="password"
            [type]="verPassword() ? 'text' : 'password'"
            formControlName="password"
            placeholder="••••••••"
            autocomplete="current-password"
            [class.invalid]="mostrarError('password')"
          />
          <button
            type="button"
            class="toggle-password"
            (click)="verPassword.set(!verPassword())"
            [attr.aria-label]="verPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" stroke-linejoin="round" />
              <circle cx="12" cy="12" r="3" />
              @if (verPassword()) {
                <path d="M4 4l16 16" stroke-linecap="round" />
              }
            </svg>
          </button>
        </div>
      </app-form-field>

      <div class="options">
        <label class="checkbox">
          <input type="checkbox" formControlName="recordarme" />
          Recordarme
        </label>
        <span class="link disabled" title="Disponible próximamente">¿Olvidaste tu contraseña?</span>
      </div>

      @if (aviso()) {
        <app-alert tono="info">{{ aviso() }}</app-alert>
      }
      @if (error()) {
        <app-alert tono="error">{{ error() }}</app-alert>
      }

      <button type="submit" class="submit" [disabled]="enviando()">
        {{ enviando() ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>
    </form>
  </section>

  <p class="auth-footer">¿No tienes cuenta?<a class="link" routerLink="/registro">Regístrate</a></p>
</app-auth-layout>
