<ng-template #iconoInfo>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
    <circle cx="12" cy="12" r="9" />
    <path d="M12 11v5M12 7.5v.01" stroke-linecap="round" />
  </svg>
</ng-template>

<ng-template #ojo let-visible>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z" stroke-linejoin="round" />
    <circle cx="12" cy="12" r="3" />
    @if (visible) {
      <path d="M4 4l16 16" stroke-linecap="round" />
    }
  </svg>
</ng-template>

<app-auth-layout
  compacto
  titulo="Crear cuenta"
  subtitulo="Regístrate para agendar tus citas médicas en Piedrazul"
>
  <section class="auth-card registro-card">
    <form [formGroup]="form" (ngSubmit)="crearCuenta()" novalidate>
      <div class="grid">
        <app-form-field
          etiqueta="Primer nombre"
          idControl="firstName"
          obligatorio
          [error]="mostrarError('firstName') ? mensaje('firstName') : ''"
        >
          <input
            id="firstName"
            formControlName="firstName"
            placeholder="Ej. María"
            autocomplete="given-name"
            [class.invalid]="mostrarError('firstName')"
          />
        </app-form-field>

        <app-form-field
          etiqueta="Segundo nombre"
          idControl="middleName"
          [error]="mostrarError('middleName') ? mensaje('middleName') : ''"
        >
          <input
            id="middleName"
            formControlName="middleName"
            placeholder="Ej. Fernanda (opcional)"
            autocomplete="additional-name"
            [class.invalid]="mostrarError('middleName')"
          />
        </app-form-field>

        <app-form-field
          etiqueta="Primer apellido"
          idControl="lastName"
          obligatorio
          [error]="mostrarError('lastName') ? mensaje('lastName') : ''"
        >
          <input
            id="lastName"
            formControlName="lastName"
            placeholder="Ej. Gómez"
            autocomplete="family-name"
            [class.invalid]="mostrarError('lastName')"
          />
        </app-form-field>

        <app-form-field
          etiqueta="Segundo apellido"
          idControl="secondLastName"
          [error]="mostrarError('secondLastName') ? mensaje('secondLastName') : ''"
        >
          <input
            id="secondLastName"
            formControlName="secondLastName"
            placeholder="Ej. Rodríguez (opcional)"
            [class.invalid]="mostrarError('secondLastName')"
          />
        </app-form-field>

        <app-form-field
          etiqueta="Correo electrónico"
          idControl="email"
          obligatorio
          [error]="mostrarError('email') ? mensaje('email') : ''"
        >
          <span
            etiquetaExtra
            class="info"
            tabindex="0"
            role="img"
            aria-label="Usarás este correo para iniciar sesión. Ejemplo: nombre@correo.com"
            data-tip="Usarás este correo para iniciar sesión. Ejemplo: nombre@correo.com"
            ><ng-container [ngTemplateOutlet]="iconoInfo"
          /></span>
          <input
            id="email"
            type="email"
            formControlName="email"
            placeholder="nombre@correo.com"
            autocomplete="email"
            [class.invalid]="mostrarError('email')"
          />
        </app-form-field>

        <app-form-field
          etiqueta="Teléfono"
          idControl="phone"
          obligatorio
          [error]="mostrarError('phone') ? mensaje('phone') : ''"
        >
          <span
            etiquetaExtra
            class="info"
            tabindex="0"
            role="img"
            aria-label="Número de celular o fijo, solo dígitos. Ejemplo: 300 123 4567"
            data-tip="Número de celular o fijo, solo dígitos. Ejemplo: 300 123 4567"
            ><ng-container [ngTemplateOutlet]="iconoInfo"
          /></span>
          <input
            id="phone"
            type="tel"
            formControlName="phone"
            placeholder="300 123 4567"
            autocomplete="tel"
            [class.invalid]="mostrarError('phone')"
          />
        </app-form-field>

        <app-form-field
          etiqueta="Fecha de nacimiento"
          idControl="birthDate"
          obligatorio
          [error]="mostrarError('birthDate') ? mensaje('birthDate') : ''"
        >
          <span
            etiquetaExtra
            class="info"
            tabindex="0"
            role="img"
            aria-label="Selecciónala en el calendario o escríbela como día/mes/año"
            data-tip="Selecciónala en el calendario o escríbela como día/mes/año"
            ><ng-container [ngTemplateOutlet]="iconoInfo"
          /></span>
          <input
            id="birthDate"
            type="date"
            formControlName="birthDate"
            min="1900-01-01"
            [max]="hoy"
            autocomplete="bday"
            [class.invalid]="mostrarError('birthDate')"
          />
        </app-form-field>

        <app-form-field
          etiqueta="Género"
          idControl="gender"
          obligatorio
          [error]="mostrarError('gender') ? mensaje('gender') : ''"
        >
          <select id="gender" formControlName="gender" [class.invalid]="mostrarError('gender')">
            <option value="" disabled>Seleccionar...</option>
            @for (genero of generos; track genero.value) {
              <option [value]="genero.value">{{ genero.label }}</option>
            }
          </select>
        </app-form-field>

        <app-form-field
          etiqueta="Tipo de documento"
          idControl="documentType"
          obligatorio
          [error]="mostrarError('documentType') ? mensaje('documentType') : ''"
        >
          <span
            etiquetaExtra
            class="info"
            tabindex="0"
            role="img"
            aria-label="Documento de identidad con el que te atienden en Piedrazul"
            data-tip="Documento de identidad con el que te atienden en Piedrazul"
            ><ng-container [ngTemplateOutlet]="iconoInfo"
          /></span>
          <select
            id="documentType"
            formControlName="documentType"
            [class.invalid]="mostrarError('documentType')"
          >
            <option value="" disabled>Seleccionar...</option>
            @for (tipo of tiposDocumento; track tipo.value) {
              <option [value]="tipo.value">{{ tipo.label }}</option>
            }
          </select>
        </app-form-field>

        <app-form-field
          etiqueta="Número de documento"
          idControl="documentNumber"
          obligatorio
          [error]="mostrarError('documentNumber') ? mensaje('documentNumber') : ''"
        >
          <span
            etiquetaExtra
            class="info"
            tabindex="0"
            role="img"
            aria-label="Solo números y letras, sin puntos ni espacios"
            data-tip="Solo números y letras, sin puntos ni espacios"
            ><ng-container [ngTemplateOutlet]="iconoInfo"
          /></span>
          <input
            id="documentNumber"
            formControlName="documentNumber"
            placeholder="Ej. 1023456789"
            [class.invalid]="mostrarError('documentNumber')"
          />
        </app-form-field>

        <app-form-field
          etiqueta="Contraseña"
          idControl="password"
          obligatorio
          [error]="mostrarError('password') ? mensaje('password') : ''"
        >
          <span
            etiquetaExtra
            class="info"
            tabindex="0"
            role="img"
            aria-label="Mínimo 8 caracteres. Te recomendamos combinar letras y números"
            data-tip="Mínimo 8 caracteres. Te recomendamos combinar letras y números"
            ><ng-container [ngTemplateOutlet]="iconoInfo"
          /></span>
          <div class="password-input">
            <input
              id="password"
              [type]="verPassword() ? 'text' : 'password'"
              formControlName="password"
              placeholder="Mínimo 8 caracteres"
              autocomplete="new-password"
              [class.invalid]="mostrarError('password')"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="verPassword.set(!verPassword())"
              [attr.aria-label]="verPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              <ng-container
                [ngTemplateOutlet]="ojo"
                [ngTemplateOutletContext]="{ $implicit: verPassword() }"
              />
            </button>
          </div>
          @if (!mostrarError('password')) {
            <small class="hint">Mínimo 8 caracteres.</small>
          }
        </app-form-field>

        <app-form-field
          etiqueta="Confirmar contraseña"
          idControl="confirmPassword"
          obligatorio
          [error]="mostrarError('confirmPassword') ? mensaje('confirmPassword') : ''"
        >
          <div class="password-input">
            <input
              id="confirmPassword"
              [type]="verConfirmacion() ? 'text' : 'password'"
              formControlName="confirmPassword"
              placeholder="Repite tu contraseña"
              autocomplete="new-password"
              [class.invalid]="mostrarError('confirmPassword')"
            />
            <button
              type="button"
              class="toggle-password"
              (click)="verConfirmacion.set(!verConfirmacion())"
              [attr.aria-label]="verConfirmacion() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
            >
              <ng-container
                [ngTemplateOutlet]="ojo"
                [ngTemplateOutletContext]="{ $implicit: verConfirmacion() }"
              />
            </button>
          </div>
        </app-form-field>
      </div>

      @if (error()) {
        <app-alert tono="error">{{ error() }}</app-alert>
      }

      <button type="submit" class="submit" [disabled]="enviando()">
        {{ enviando() ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>
    </form>
  </section>

  <p class="auth-footer">¿Ya tienes cuenta?<a class="link" routerLink="/login">Inicia sesión</a></p>
</app-auth-layout>

@if (cuentaCreada()) {
  <div class="modal-backdrop" (click)="cerrarConfirmacion()">
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="titulo-confirmacion"
      (click)="$event.stopPropagation()"
    >
      <button
        type="button"
        class="modal__close"
        (click)="cerrarConfirmacion()"
        aria-label="Cerrar e ir a iniciar sesión"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round" />
        </svg>
      </button>
      <span class="modal__icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <circle cx="12" cy="12" r="9" />
          <path d="M8 12.5l2.5 2.5L16 9.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </span>
      <h2 id="titulo-confirmacion">¡Cuenta Creada Exitosamente!</h2>
      <p>Ya puedes iniciar sesión con tu correo y tu contraseña.</p>
    </div>
  </div>
}
