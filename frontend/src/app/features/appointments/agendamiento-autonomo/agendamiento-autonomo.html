<div class="agendamiento-autonomo">
  <h1>Agendar Cita</h1>

  <ol class="stepper">
    @for (label of steps; track label; let i = $index) {
      <li [class.active]="i === step()">{{ label }}</li>
    }
  </ol>

  <p>TODO: falta portar cada paso del wizard (servicio, profesional, calendario + slots, confirmación).</p>

  <div class="acciones">
    <button type="button" (click)="back()" [disabled]="step() === 0">Anterior</button>
    <button type="button" (click)="next()" [disabled]="step() === steps.length - 1">Siguiente</button>
  </div>
</div>
